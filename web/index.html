<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appel traduit</title>
  <meta name="theme-color" content="#0f1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Appel traduit">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icone.svg">
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <script>
    // Installation comme application (PWA) sur téléphone et ordinateur.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0f1117; color: #e7e9ee;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .carte {
      width: min(380px, 92vw); padding: 32px; border-radius: 16px;
      background: #171a23; box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    h1 { font-size: 1.3rem; margin: 0 0 24px; font-weight: 600; }
    label { display: block; font-size: .85rem; color: #9aa3b2; margin-bottom: 6px; }
    input, select {
      width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 16px;
      border-radius: 10px; border: 1px solid #2a2f3c; background: #0f1117;
      color: inherit; font-size: 1rem;
    }
    .consentement {
      display: flex; gap: 10px; align-items: flex-start; font-size: .85rem;
      color: #9aa3b2; margin-bottom: 16px;
    }
    .consentement input { width: auto; margin: 3px 0 0; }
    button {
      width: 100%; padding: 12px; border: 0; border-radius: 10px;
      background: #4f7cff; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button.secondaire { background: #2a2f3c; margin-top: 10px; }
    button:disabled { opacity: .5; cursor: default; }
    #statut { margin-top: 16px; font-size: .9rem; color: #9aa3b2; min-height: 1.2em; }
    .conseil { font-size: .8rem; color: #6f7888; margin-top: 12px; }
    #sous-titres {
      margin-top: 20px; min-height: 4em; font-size: 1rem; line-height: 1.4;
      border-top: 1px solid #2a2f3c; padding-top: 16px;
    }
    #sous-titres p { margin: 0 0 8px; }
    #sous-titres .auteur { color: #9aa3b2; font-size: .8rem; }
  </style>
</head>
<body>
  <main class="carte">
    <h1>Appel traduit</h1>
    <label for="nom">Votre nom</label>
    <input id="nom" autocomplete="off" maxlength="64">
    <label for="langue">Votre langue</label>
    <select id="langue"></select>
    <label for="voix">Voix de traduction</label>
    <select id="voix"></select>
    <label for="salle">Nom de la salle</label>
    <input id="salle" autocomplete="off" maxlength="64">
    <label for="motdepasse">Mot de passe de l'appel</label>
    <input id="motdepasse" type="password" autocomplete="off">
    <label class="consentement">
      <input id="consentement" type="checkbox">
      <span>J'accepte que ma voix soit transcrite et traduite automatiquement, et que le texte
      soit envoyé à des services tiers (transcription, traduction, synthèse vocale) pour cet appel
      uniquement.</span>
    </label>
    <button id="rejoindre">Rejoindre l'appel</button>
    <button id="quitter" class="secondaire" disabled>Quitter</button>
    <div id="statut"></div>
    <p class="conseil">Utilisez un casque pour éviter que la traduction ne soit captée par votre micro.</p>
    <div id="sous-titres" aria-live="polite"></div>
  </main>
  <div id="audio"></div>

  <script>
    const { Room, RoomEvent, createLocalAudioTrack } = LivekitClient;
    // Liste des langues, nommées dans la langue de l'interface.
    const CODES_LANGUES = "af am ar as az ba be bg bn bo br bs ca cs cy da de el en es et eu fa fi fo fr gl gu ha haw he hi hr ht hu hy id is it ja jw ka kk km kn ko la lb ln lo lt lv mg mi mk ml mn mr ms mt my ne nl nn no oc pa pl ps pt ro ru sa sd si sk sl sn so sq sr su sv sw ta te tg th tk tl tr tt uk ur uz vi yi yo yue zh".split(" ");
    (function remplirLangues() {
      const noms = new Intl.DisplayNames(["fr"], { type: "language" });
      const select = document.getElementById("langue");
      CODES_LANGUES
        .map((code) => {
          let nom = code;
          try { nom = noms.of(code) || code; } catch { nom = code; }
          return { code, nom };
        })
        .sort((a, b) => a.nom.localeCompare(b.nom, "fr"))
        .forEach(({ code, nom }) => {
          const option = document.createElement("option");
          option.value = code;
          option.textContent = nom;
          select.appendChild(option);
        });
      select.value = "fr";
    })();

    let room = null;
    let maLangue = null;
    let maVoix = null;
    const conteneurAudio = document.getElementById("audio");
    const conteneurSousTitres = document.getElementById("sous-titres");
    const selectLangue = document.getElementById("langue");
    const selectVoix = document.getElementById("voix");

    const statut = (texte) => document.getElementById("statut").textContent = texte;

    // Charge les voix disponibles pour la langue choisie. Les voix féminines viennent en premier.
    async function chargerVoix() {
      selectVoix.innerHTML = "";
      try {
        const reponse = await fetch(`/voix?langue=${encodeURIComponent(selectLangue.value)}`);
        if (!reponse.ok) throw new Error(await reponse.text());
        const voix = await reponse.json();
        voix.forEach(({ voix: code, genre, nom }) => {
          const option = document.createElement("option");
          option.value = code;
          option.textContent = `${nom} (${genre === "Female" ? "féminine" : "masculine"})`;
          selectVoix.appendChild(option);
        });
        if (!voix.length) statut("Aucune voix disponible pour cette langue.");
      } catch (erreur) {
        statut("Erreur voix : " + erreur.message);
      }
    }
    selectLangue.addEventListener("change", chargerVoix);
    chargerVoix();

    function metadonneesDuParticipant(participant) {
      try {
        return JSON.parse(participant.metadata || "{}");
      } catch {
        return {};
      }
    }

    // Je n'entends que :
    // - la voix traduite par l'agent dans ma langue et avec ma voix ;
    // - la voix originale d'un participant qui parle déjà ma langue.
    function doitEtreEntendu(track, publication, participant) {
      if (track.kind !== "audio") return false;
      if (participant.isAgent) {
        return publication.trackName === `traduction-${maLangue}-${maVoix}`;
      }
      return metadonneesDuParticipant(participant).langue === maLangue;
    }

    // Sous-titres : je n'affiche que le texte dans ma langue.
    // Si le participant parle ma langue, j'affiche son texte original ; sinon ma traduction.
    function afficherSousTitre(message) {
      let texte = null;
      if (message.langue_source === maLangue) {
        texte = message.original;
      } else {
        texte = (message.traductions || {})[maLangue] || null;
      }
      if (!texte) return;

      const ligne = document.createElement("p");
      const auteur = document.createElement("span");
      auteur.className = "auteur";
      auteur.textContent = message.auteur + " : ";
      ligne.appendChild(auteur);
      ligne.appendChild(document.createTextNode(texte));
      conteneurSousTitres.appendChild(ligne);
      while (conteneurSousTitres.children.length > 3) {
        conteneurSousTitres.removeChild(conteneurSousTitres.firstChild);
      }
    }

    document.getElementById("rejoindre").addEventListener("click", async () => {
      const nom = document.getElementById("nom").value.trim();
      const salle = document.getElementById("salle").value.trim();
      const motdepasse = document.getElementById("motdepasse").value;
      maLangue = selectLangue.value;
      maVoix = selectVoix.value;
      if (!nom || !salle) { statut("Renseignez votre nom et la salle."); return; }
      if (!motdepasse) { statut("Saisissez le mot de passe de l'appel."); return; }
      if (!document.getElementById("consentement").checked) {
        statut("Vous devez accepter le traitement de votre voix pour rejoindre l'appel.");
        return;
      }
      if (!maVoix) { statut("Choisissez une voix."); return; }

      statut("Connexion...");
      const reponse = await fetch(
        `/token?identite=${encodeURIComponent(nom)}&salle=${encodeURIComponent(salle)}` +
        `&langue=${encodeURIComponent(maLangue)}&voix=${encodeURIComponent(maVoix)}` +
        `&motdepasse=${encodeURIComponent(motdepasse)}`
      );
      if (reponse.status === 401) { statut("Mot de passe incorrect."); return; }
      if (!reponse.ok) { statut("Erreur : " + (await reponse.text())); return; }
      const { token, url } = await reponse.json();

      room = new Room();

      room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
        if (doitEtreEntendu(track, publication, participant)) {
          conteneurAudio.appendChild(track.attach());
        }
      });

      room.on(RoomEvent.TrackUnsubscribed, (track) => {
        track.detach().forEach((element) => element.remove());
      });

      room.on(RoomEvent.DataReceived, (payload, participant, kind, topic) => {
        if (topic !== "sous-titres") return;
        try {
          afficherSousTitre(JSON.parse(new TextDecoder().decode(payload)));
        } catch {
          // Message mal formé : on l'ignore.
        }
      });

      room.on(RoomEvent.Disconnected, () => {
        conteneurAudio.innerHTML = "";
        conteneurSousTitres.innerHTML = "";
        statut("Appel terminé.");
        document.getElementById("rejoindre").disabled = false;
        document.getElementById("quitter").disabled = true;
        selectLangue.disabled = false;
        selectVoix.disabled = false;
      });

      await room.connect(url, token);
      const micro = await createLocalAudioTrack();
      await room.localParticipant.publishTrack(micro);

      statut("Connecté à « " + salle + " » en " + maLangue + ". Parlez, les autres entendront leur langue.");
      document.getElementById("rejoindre").disabled = true;
      document.getElementById("quitter").disabled = false;
      selectLangue.disabled = true;
      selectVoix.disabled = true;
      document.getElementById("motdepasse").value = "";
    });

    document.getElementById("quitter").addEventListener("click", () => {
      if (room) room.disconnect();
    });
  </script>
</body>
</html>
