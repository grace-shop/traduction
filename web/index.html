<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Appel traduit</title>
  <meta name="description" content="Parlez dans votre langue, entendez la leur.">
  <meta name="theme-color" content="#05060d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Appel traduit">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icone.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Installation comme application (PWA) sur téléphone et ordinateur.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --fond: #04050b;
      --texte: #f1f4ff;
      --discret: #8a93b0;
      --bord: rgba(255, 255, 255, 0.09);
      --verre: rgba(16, 19, 36, 0.58);
      --cyan: #41f0ff;
      --violet: #8e5dff;
      --rose: #ff5ad6;
      --or: #ffd27a;
      --rouge: #ff4d6d;
      --ombre: 0 40px 100px -30px rgba(0, 0, 0, 0.95);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fond); color: var(--texte);
      overflow: hidden; min-height: 100dvh;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }

    /* ================= Fond ================= */
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .aurore { position: fixed; inset: -20%; z-index: 1; pointer-events: none; overflow: hidden; }
    .aurore::before, .aurore::after {
      content: ""; position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55;
      animation: derive 26s ease-in-out infinite alternate;
    }
    .aurore::before { width: 60vmax; height: 60vmax; left: -10%; top: -15%;
      background: radial-gradient(circle, rgba(142, 93, 255, .55), transparent 65%); }
    .aurore::after { width: 55vmax; height: 55vmax; right: -12%; bottom: -18%;
      background: radial-gradient(circle, rgba(65, 240, 255, .42), transparent 65%);
      animation-duration: 32s; animation-delay: -8s; }
    .voile {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, .7) 100%);
    }

    .ecran { position: relative; z-index: 3; height: 100dvh; display: flex; flex-direction: column; }

    /* ================= Bordure holographique ================= */
    .holo { position: relative; isolation: isolate; }
    .holo::before {
      content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; z-index: -1;
      background: conic-gradient(from var(--angle, 0deg), var(--cyan), var(--violet), var(--rose), var(--cyan));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      animation: tourneBordure 7s linear infinite; opacity: .6; pointer-events: none;
    }
    @property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    @keyframes tourneBordure { to { --angle: 360deg; } }

    /* ================= Accueil ================= */
    #accueil { align-items: center; justify-content: center; padding: 22px; }
    .carte {
      width: min(460px, 100%); padding: 34px 32px 28px; border-radius: 30px;
      background: linear-gradient(170deg, rgba(26, 31, 62, .74), rgba(7, 9, 20, .86));
      box-shadow: var(--ombre), 0 0 80px rgba(142, 93, 255, .14), inset 0 1px 0 rgba(255, 255, 255, .06);
      backdrop-filter: blur(26px) saturate(140%); -webkit-backdrop-filter: blur(26px) saturate(140%);
      transform-style: preserve-3d;
      transform: rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg));
      transition: transform .35s cubic-bezier(.2, .8, .2, 1);
      animation: entree .9s cubic-bezier(.2, .8, .2, 1) both;
    }
    .entete { text-align: center; margin-bottom: 26px; }
    .logo-orbe {
      width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 22px; position: relative;
      background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--rose), var(--or), var(--cyan));
      box-shadow: 0 0 40px rgba(65, 240, 255, .35), 0 0 80px rgba(142, 93, 255, .25);
      display: grid; place-items: center; color: #05060d; font-weight: 800; font-size: 22px;
      animation: respire 4s ease-in-out infinite;
    }
    .logo-orbe::after {
      content: ""; position: absolute; inset: 8px; border-radius: 16px; background: #0a0d1c;
      z-index: -0;
    }
    .logo-orbe span { position: relative; z-index: 1; background: linear-gradient(135deg, var(--cyan), var(--rose));
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em; }
    .sous-titre-accueil { margin-top: 6px; color: var(--discret); font-size: .9rem; }

    .champ { position: relative; margin-bottom: 16px; }
    .champ label {
      display: block; font-size: .72rem; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; color: var(--discret); margin: 0 0 7px 4px;
    }
    .champ input, .champ select {
      width: 100%; padding: 14px 16px; border-radius: 16px;
      border: 1px solid var(--bord); background: rgba(3, 4, 10, .55);
      color: var(--texte); font: inherit; font-size: 15px; outline: none;
      transition: border-color .25s, box-shadow .25s, background .25s;
      appearance: none; -webkit-appearance: none;
    }
    .champ select {
      padding-right: 42px; cursor: pointer;
      background-image: linear-gradient(45deg, transparent 50%, var(--cyan) 50%),
                        linear-gradient(135deg, var(--cyan) 50%, transparent 50%);
      background-position: calc(100% - 22px) 52%, calc(100% - 16px) 52%;
      background-size: 6px 6px; background-repeat: no-repeat;
    }
    .champ select option { background: #0b0e1d; color: var(--texte); }
    .champ input:focus, .champ select:focus {
      border-color: rgba(65, 240, 255, .7); background: rgba(3, 4, 10, .8);
      box-shadow: 0 0 0 4px rgba(65, 240, 255, .12), 0 0 30px rgba(65, 240, 255, .15);
    }
    .champ input:disabled, .champ select:disabled { opacity: .5; }
    .ligne-deux { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .consentement {
      display: flex; gap: 12px; align-items: flex-start; cursor: pointer;
      font-size: .8rem; color: var(--discret); margin: 4px 0 22px; line-height: 1.5;
    }
    .consentement input {
      appearance: none; -webkit-appearance: none; flex: none; width: 20px; height: 20px; margin-top: 1px;
      border-radius: 7px; border: 1px solid var(--bord); background: rgba(3, 4, 10, .55);
      display: grid; place-items: center; cursor: pointer; transition: all .2s;
    }
    .consentement input:checked {
      background: linear-gradient(135deg, var(--cyan), var(--violet)); border-color: transparent;
      box-shadow: 0 0 18px rgba(65, 240, 255, .35);
    }
    .consentement input:checked::after {
      content: ""; width: 6px; height: 10px; border: solid #05060d; border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .principal {
      position: relative; width: 100%; padding: 16px; border: 0; border-radius: 18px; overflow: hidden;
      background: linear-gradient(120deg, var(--violet), #4aa8ff 45%, var(--cyan));
      background-size: 200% 100%; color: #05060d; font: inherit; font-weight: 800; font-size: 15px;
      letter-spacing: .02em; cursor: pointer;
      box-shadow: 0 16px 40px -10px rgba(74, 168, 255, .55), inset 0 1px 0 rgba(255, 255, 255, .35);
      transition: transform .2s, box-shadow .3s, background-position .6s;
    }
    .principal::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, .45) 50%, transparent 60%);
      transform: translateX(-120%); transition: transform .8s;
    }
    .principal:hover { transform: translateY(-2px); background-position: 100% 0; box-shadow: 0 22px 50px -10px rgba(74, 168, 255, .7); }
    .principal:hover::after { transform: translateX(120%); }
    .principal:active { transform: scale(.985); }
    .principal:disabled { opacity: .55; cursor: default; transform: none; }
    .principal.chargement { animation: pulsePrincipal 1.2s ease-in-out infinite; }

    #statut {
      min-height: 1.4em; margin-top: 16px; font-size: .88rem; color: var(--discret);
      text-align: center; transition: color .3s;
    }
    #statut.erreur { color: #ff9bb0; }
    .conseil { margin-top: 10px; font-size: .74rem; color: #5b6482; text-align: center; line-height: 1.5; }

    /* ================= Appel ================= */
    #appel { min-height: 0; }
    .entete-appel {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 24px 8px;
    }
    .marque-appel { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .marque-appel .logo-petit {
      width: 38px; height: 38px; border-radius: 13px; flex: none;
      background: conic-gradient(var(--cyan), var(--violet), var(--rose), var(--cyan));
      display: grid; place-items: center; color: #05060d; font-weight: 800; font-size: 15px;
      box-shadow: 0 0 22px rgba(65, 240, 255, .35);
    }
    .marque-appel strong { display: block; font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .marque-appel small { display: block; color: var(--discret); font-size: .78rem; margin-top: 2px; }
    .hud {
      flex: none; font-size: 13px; font-variant-numeric: tabular-nums; letter-spacing: .08em;
      padding: 9px 16px; border-radius: 999px; background: var(--verre); border: 1px solid var(--bord);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      display: flex; align-items: center; gap: 10px;
    }
    .rec {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--rouge); box-shadow: 0 0 12px var(--rouge);
      animation: clignote 1.4s infinite;
    }

    .grille {
      flex: 1; min-height: 0; overflow: auto;
      display: grid; align-content: center; justify-content: center;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr));
      gap: 22px; padding: 10px 28px; perspective: 1800px;
    }
    .tuile {
      --h: 260;
      position: relative; min-height: 250px; border-radius: 30px;
      transform-style: preserve-3d;
      transform: rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg));
      transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .5s;
      background:
        radial-gradient(circle at 50% 0%, hsla(var(--h), 90%, 60%, .22), transparent 60%),
        linear-gradient(170deg, rgba(24, 28, 56, .82), rgba(6, 8, 18, .92));
      border: 1px solid var(--bord);
      box-shadow: 0 30px 70px -25px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(255, 255, 255, .05);
      display: grid; place-items: center; overflow: hidden;
      animation: entree .7s cubic-bezier(.2, .8, .2, 1) both;
    }
    /* Reflet qui balaie la carte */
    .tuile::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .06) 50%, transparent 65%);
      transform: translateX(-100%); animation: reflet 7s ease-in-out infinite;
    }
    .tuile.parle {
      box-shadow: 0 30px 90px -20px hsla(var(--h), 95%, 60%, .45),
                  0 0 0 1px hsla(var(--h), 95%, 70%, .55) inset;
    }
    .tuile.parle .orbe { animation: pulsation 1s ease-in-out infinite; }
    .tuile.parle .orbe::before { opacity: 1; animation-duration: 2.4s; }
    .tuile.moi .etiquette { border-color: rgba(65, 240, 255, .35); }

    .flot {
      transform: translateZ(60px);
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      animation: flotte 7s ease-in-out infinite;
    }
    .orbe {
      position: relative;
      width: clamp(96px, 17vmin, 156px); aspect-ratio: 1; border-radius: 50%;
      background:
        radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .7), transparent 22%),
        radial-gradient(circle at 60% 72%, hsla(var(--h), 100%, 70%, .6), transparent 55%),
        radial-gradient(circle at 50% 50%, hsl(var(--h), 85%, 48%), hsl(calc(var(--h) + 50), 80%, 26%) 70%, #05060d);
      box-shadow: 0 0 50px hsla(var(--h), 95%, 60%, .45), inset 0 -22px 44px rgba(0, 0, 0, .5);
      display: grid; place-items: center;
      font-size: clamp(30px, 5.5vmin, 52px); font-weight: 800; color: #fff;
      text-shadow: 0 2px 16px rgba(0, 0, 0, .35);
    }
    .orbe::before {
      content: ""; position: absolute; inset: -16px; border-radius: 50%; opacity: .55;
      background: conic-gradient(from 0deg, transparent, hsla(var(--h), 100%, 70%, .9), transparent 35%);
      -webkit-mask: radial-gradient(circle, transparent 62%, #000 63%, #000 67%, transparent 68%);
              mask: radial-gradient(circle, transparent 62%, #000 63%, #000 67%, transparent 68%);
      animation: tourne 9s linear infinite;
    }
    .orbe::after {
      content: ""; position: absolute; inset: -30px; border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, .12); animation: tourne 26s linear infinite reverse;
    }
    .etiquette {
      display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600;
      padding: 9px 16px; border-radius: 14px;
      background: rgba(4, 5, 12, .62); border: 1px solid var(--bord);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .etiquette .point { width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--h), 90%, 65%); box-shadow: 0 0 10px hsl(var(--h), 90%, 65%); }

    /* ================= Sous-titres ================= */
    .sous-titres {
      position: relative; z-index: 4; min-height: 90px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px;
      padding: 0 24px 6px; pointer-events: none;
    }
    .sous-titres p {
      max-width: min(860px, 100%); position: relative;
      background: linear-gradient(180deg, rgba(22, 28, 54, .8), rgba(7, 9, 20, .86));
      border: 1px solid rgba(65, 240, 255, .22);
      box-shadow: 0 0 36px rgba(65, 240, 255, .1), inset 0 1px 0 rgba(255, 255, 255, .06);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      padding: 14px 20px 14px 22px; border-radius: 18px; text-align: left;
      font-size: clamp(15px, 2.2vmin, 19px); line-height: 1.5; font-weight: 600; color: #fff;
      animation: apparait .5s cubic-bezier(.2, .8, .2, 1);
    }
    .sous-titres p::before {
      content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px;
      background: linear-gradient(var(--cyan), var(--violet));
    }
    .sous-titres .entete-ligne { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .sous-titres .badge {
      font-size: 10px; font-weight: 800; letter-spacing: .1em; padding: 3px 7px; border-radius: 6px;
      background: rgba(65, 240, 255, .14); color: #aef6ff;
    }
    .sous-titres .auteur { color: var(--discret); font-size: .8em; font-weight: 600; }

    /* ================= Barre de contrôle ================= */
    .dock {
      align-self: center; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
      padding: 10px; margin: 10px 0 calc(18px + env(safe-area-inset-bottom, 0px));
      border-radius: 28px; max-width: calc(100% - 24px);
      background: linear-gradient(180deg, rgba(20, 24, 46, .72), rgba(6, 8, 18, .78));
      border: 1px solid var(--bord);
      box-shadow: 0 24px 70px -15px rgba(0, 0, 0, .8), 0 0 60px rgba(142, 93, 255, .12);
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    }
    .bouton {
      position: relative; height: 54px; min-width: 54px; padding: 0 18px; border-radius: 18px;
      border: 1px solid transparent; background: rgba(255, 255, 255, .05); color: var(--texte);
      font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      transition: transform .2s, background .25s, border-color .25s, box-shadow .25s;
    }
    .bouton svg { width: 21px; height: 21px; flex: none; }
    .bouton:hover { background: rgba(255, 255, 255, .1); transform: translateY(-2px); box-shadow: 0 10px 26px -8px rgba(65, 240, 255, .35); }
    .bouton:active { transform: scale(.96); }
    .bouton.on { border-color: rgba(65, 240, 255, .4); background: rgba(65, 240, 255, .1); }
    .bouton.off { background: rgba(255, 77, 109, .14); border-color: rgba(255, 77, 109, .45); color: #ffc0cd; }
    .bouton.fin {
      background: linear-gradient(135deg, #ff4d6d, #ff2e8a 60%, #c2189e); color: #fff;
      box-shadow: 0 12px 30px -8px rgba(255, 46, 138, .6);
    }
    .bouton.fin:hover { box-shadow: 0 16px 36px -8px rgba(255, 46, 138, .8); }

    /* Info-bulles au survol */
    .bouton[data-tip]::after {
      content: attr(data-tip); position: absolute; bottom: calc(100% + 12px); left: 50%;
      transform: translate(-50%, 6px); white-space: nowrap; font-size: 12px; font-weight: 600;
      padding: 6px 10px; border-radius: 10px; background: rgba(4, 5, 12, .9); color: var(--texte);
      border: 1px solid var(--bord); opacity: 0; pointer-events: none; transition: all .2s;
    }
    .bouton[data-tip]:hover::after { opacity: 1; transform: translate(-50%, 0); }

    /* ================= Animations ================= */
    @keyframes entree { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes derive { to { transform: translate3d(6%, 4%, 0) rotate(20deg); } }
    @keyframes respire { 50% { transform: scale(1.06); box-shadow: 0 0 60px rgba(65, 240, 255, .5), 0 0 110px rgba(142, 93, 255, .35); } }
    @keyframes tourne { to { transform: rotate(360deg); } }
    @keyframes pulsation { 50% { transform: scale(1.06); } }
    @keyframes flotte { 50% { transform: translateZ(60px) translateY(-10px); } }
    @keyframes clignote { 50% { opacity: .25; } }
    @keyframes reflet { 0%, 60% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    @keyframes pulsePrincipal { 50% { box-shadow: 0 0 0 10px rgba(74, 168, 255, 0); filter: brightness(1.12); } }
    @keyframes apparait {
      from { opacity: 0; transform: translateY(14px) scale(.97); filter: blur(5px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }

    /* ================= Mobile ================= */
    @media (max-width: 640px) {
      .carte { padding: 26px 22px 22px; border-radius: 26px; }
      .ligne-deux { grid-template-columns: 1fr; gap: 0; }
      .grille { padding: 6px 14px; gap: 14px; }
      .tuile { min-height: 200px; border-radius: 26px; }
      .entete-appel { padding-left: 16px; padding-right: 16px; }
      .bouton span { display: none; }
      .bouton { min-width: 52px; height: 52px; padding: 0 14px; }
      .bouton[data-tip]::after { display: none; }
      .sous-titres { padding: 0 14px 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="aurore" aria-hidden="true"></div>
  <div class="voile" aria-hidden="true"></div>

  <!-- ===== Accueil ===== -->
  <section id="accueil" class="ecran">
    <main class="carte holo" data-tilt>
      <header class="entete">
        <div class="logo-orbe"><span>T</span></div>
        <h1>Appel traduit</h1>
        <p class="sous-titre-accueil">Parlez dans votre langue, entendez la leur.</p>
      </header>

      <div class="champ">
        <label for="nom">Votre nom</label>
        <input id="nom" autocomplete="off" maxlength="64" placeholder="Comment vous appeler ?">
      </div>

      <div class="ligne-deux">
        <div class="champ">
          <label for="langue">Votre langue</label>
          <select id="langue"></select>
        </div>
        <div class="champ">
          <label for="voix">Voix de traduction</label>
          <select id="voix"></select>
        </div>
      </div>

      <div class="champ">
        <label for="salle">Nom de la salle</label>
        <input id="salle" autocomplete="off" maxlength="64" placeholder="Ex. famille-dimanche">
      </div>
      <div class="champ">
        <label for="motdepasse">Mot de passe de l'appel</label>
        <input id="motdepasse" type="password" autocomplete="off">
      </div>

      <label class="consentement">
        <input id="consentement" type="checkbox">
        <span>J'accepte que ma voix soit transcrite et traduite automatiquement, et que le texte
        soit envoyé à des services tiers (transcription, traduction, synthèse vocale) pour cet appel
        uniquement.</span>
      </label>

      <button id="rejoindre" class="principal">Rejoindre l'appel</button>
      <div id="statut" role="status"></div>
      <p class="conseil">Utilisez un casque pour éviter que la traduction ne soit captée par votre micro.</p>
    </main>
  </section>

  <!-- ===== Appel ===== -->
  <section id="appel" class="ecran" hidden>
    <header class="entete-appel">
      <div class="marque-appel">
        <div class="logo-petit">T</div>
        <div>
          <strong id="titre-salle"></strong>
          <small id="sous-titre-salle"></small>
        </div>
      </div>
      <div class="hud"><span class="rec"></span><span id="horloge">00:00</span></div>
    </header>

    <main id="grille" class="grille"></main>

    <div id="sous-titres" class="sous-titres" aria-live="polite"></div>

    <nav class="dock" aria-label="Contrôles de l'appel">
      <button id="btn-sst" class="bouton on" aria-pressed="true" data-tip="Sous-titres"></button>
      <button id="btn-voix" class="bouton on" aria-pressed="true" data-tip="Voix IA"></button>
      <button id="btn-micro" class="bouton on" aria-pressed="true" data-tip="Micro"></button>
      <button id="btn-quitter" class="bouton fin" data-tip="Raccrocher"></button>
    </nav>
  </section>

  <div id="audio" hidden></div>

  <script>
    /* ============================================================
       Icônes
       ============================================================ */
    const SVG = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
    const ICONES = {
      micro:    `<svg ${SVG}><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>`,
      microOff: `<svg ${SVG}><path d="M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.7-1.3"/><path d="M5 10a7 7 0 0 0 11.6 5.3M19 10a7 7 0 0 1-.9 3.4M12 19v3M2 2l20 20"/></svg>`,
      sst:      `<svg ${SVG}><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 11h4M13 11h4M7 15h10"/></svg>`,
      voix:     `<svg ${SVG}><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>`,
      voixOff:  `<svg ${SVG}><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>`,
      fin:      `<svg ${SVG}><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>`
    };

    /* ============================================================
       Scène 3D de fond : noyau en fil de fer, anneaux, particules
       ============================================================ */
    (function initScene() {
      if (!window.THREE) return; // Sans Three.js, le fond CSS reste élégant.
      const canvas = document.getElementById("scene");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x04050b, 0.04);
      const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
      camera.position.set(0, 2, 30);

      // Noyau : icosaèdre en fil de fer, au centre et en arrière-plan.
      const noyau = new THREE.Mesh(
        new THREE.IcosahedronGeometry(9, 1),
        new THREE.MeshBasicMaterial({ color: 0x41f0ff, wireframe: true, transparent: true, opacity: 0.22 })
      );
      scene.add(noyau);
      const noyauInterne = new THREE.Mesh(
        new THREE.IcosahedronGeometry(5.2, 0),
        new THREE.MeshBasicMaterial({ color: 0x8e5dff, wireframe: true, transparent: true, opacity: 0.35 })
      );
      scene.add(noyauInterne);

      // Anneaux orbitaux.
      const anneaux = [];
      [[13, 0x8e5dff, 0.5, 1.2], [16.5, 0xff5ad6, 0.3, 0.7], [20, 0x41f0ff, 0.25, 0.4]].forEach(([r, c, o, inc]) => {
        const a = new THREE.Mesh(
          new THREE.TorusGeometry(r, 0.035, 8, 220),
          new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o })
        );
        a.rotation.x = inc;
        scene.add(a);
        anneaux.push(a);
      });

      // Grille au sol, qui défile vers la caméra.
      const grille = new THREE.GridHelper(140, 70, 0x41f0ff, 0x2a1f66);
      grille.position.y = -12;
      grille.material.transparent = true;
      grille.material.opacity = 0.18;
      scene.add(grille);

      // Particules.
      const COUNT = 1800;
      const positions = new Float32Array(COUNT * 3);
      for (let i = 0; i < COUNT; i++) {
        const rayon = 30 + Math.random() * 60;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i * 3]     = rayon * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = rayon * Math.cos(phi) * 0.6;
        positions[i * 3 + 2] = rayon * Math.sin(phi) * Math.sin(theta);
      }
      const geometrie = new THREE.BufferGeometry();
      geometrie.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const particules = new THREE.Points(geometrie, new THREE.PointsMaterial({
        size: 0.13, color: 0xbff7ff, transparent: true, opacity: 0.75, depthWrite: false
      }));
      scene.add(particules);

      function redimensionner() {
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", redimensionner);
      redimensionner();

      const cible = { x: 0, y: 0 };
      window.addEventListener("pointermove", (e) => {
        cible.x = e.clientX / window.innerWidth - 0.5;
        cible.y = e.clientY / window.innerHeight - 0.5;
      });

      const horloge = new THREE.Clock();
      (function boucle() {
        const t = horloge.getElapsedTime();
        noyau.rotation.y = t * 0.08;
        noyau.rotation.x = Math.sin(t * 0.2) * 0.2;
        noyauInterne.rotation.y = -t * 0.14;
        noyauInterne.rotation.z = t * 0.07;
        anneaux.forEach((a, i) => { a.rotation.z = t * (0.06 + i * 0.03); });
        grille.position.z = (t * 1.4) % 4;
        particules.rotation.y = t * 0.02;
        camera.position.x += (cible.x * 8 - camera.position.x) * 0.03;
        camera.position.y += (2 - cible.y * 5 - camera.position.y) * 0.03;
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
        requestAnimationFrame(boucle);
      })();
    })();

    /* ============================================================
       Inclinaison 3D au passage de la souris
       ============================================================ */
    function activerInclinaison(el) {
      el.addEventListener("pointermove", (e) => {
        const r = el.getBoundingClientRect();
        el.style.setProperty("--ry", ((e.clientX - r.left) / r.width - 0.5) * 9 + "deg");
        el.style.setProperty("--rx", -((e.clientY - r.top) / r.height - 0.5) * 7 + "deg");
      });
      el.addEventListener("pointerleave", () => {
        el.style.setProperty("--ry", "0deg");
        el.style.setProperty("--rx", "0deg");
      });
    }
    document.querySelectorAll("[data-tilt]").forEach(activerInclinaison);

    /* ============================================================
       Langues (noms affichés dans la langue de l'interface)
       ============================================================ */
    const CODES_LANGUES = "af am ar as az ba be bg bn bo br bs ca cs cy da de el en es et eu fa fi fo fr gl gu ha haw he hi hr ht hu hy id is it ja jw ka kk km kn ko la lb ln lo lt lv mg mi mk ml mn mr ms mt my ne nl nn no oc pa pl ps pt ro ru sa sd si sk sl sn so sq sr su sv sw ta te tg th tk tl tr tt uk ur uz vi yi yo yue zh".split(" ");
    (function remplirLangues() {
      const noms = new Intl.DisplayNames(["fr"], { type: "language" });
      const select = document.getElementById("langue");
      CODES_LANGUES
        .map((code) => {
          let nom = code;
          try { nom = noms.of(code) || code; } catch { nom = code; }
          return { code, nom };
        })
        .sort((a, b) => a.nom.localeCompare(b.nom, "fr"))
        .forEach(({ code, nom }) => {
          const option = document.createElement("option");
          option.value = code;
          option.textContent = nom;
          select.appendChild(option);
        });
      select.value = "fr";
    })();

    /* ============================================================
       Accueil : voix disponibles selon la langue
       ============================================================ */
    const { Room, RoomEvent, createLocalAudioTrack } = LivekitClient;
    const selectLangue = document.getElementById("langue");
    const selectVoix = document.getElementById("voix");
    const statutEl = document.getElementById("statut");
    const statut = (texte, erreur = false) => {
      statutEl.textContent = texte;
      statutEl.classList.toggle("erreur", erreur);
    };

    async function chargerVoix() {
      selectVoix.innerHTML = "";
      try {
        const reponse = await fetch(`/voix?langue=${encodeURIComponent(selectLangue.value)}`);
        if (!reponse.ok) throw new Error(await reponse.text());
        const voix = await reponse.json();
        voix.forEach(({ voix: code, genre, nom }) => {
          const option = document.createElement("option");
          option.value = code;
          option.textContent = `${nom} (${genre === "Female" ? "féminine" : "masculine"})`;
          selectVoix.appendChild(option);
        });
        if (!voix.length) statut("Aucune voix disponible pour cette langue.", true);
      } catch (erreur) {
        statut("Erreur voix : " + erreur.message, true);
      }
    }
    selectLangue.addEventListener("change", chargerVoix);
    chargerVoix();

    /* ============================================================
       État de l'appel
       ============================================================ */
    let room = null;
    let maLangue = null;
    let maVoix = null;
    let sousTitresActifs = true;
    let vocalActif = true;
    let micActif = true;
    let minuterie = null;

    const tuiles = new Map();          // identité -> élément
    const sortiesAudio = [];           // { track, element }
    const conteneurAudio = document.getElementById("audio");
    const conteneurSousTitres = document.getElementById("sous-titres");
    const grille = document.getElementById("grille");
    const accueil = document.getElementById("accueil");
    const appel = document.getElementById("appel");

    function metadonneesDuParticipant(participant) {
      try { return JSON.parse(participant.metadata || "{}"); } catch { return {}; }
    }

    // Je n'entends que :
    // - la voix traduite par l'agent dans ma langue et avec ma voix ;
    // - la voix originale d'un participant qui parle déjà ma langue.
    function doitEtreEntendu(track, publication, participant) {
      if (track.kind !== "audio") return false;
      if (participant.isAgent) {
        return publication.trackName === `traduction-${maLangue}-${maVoix}`;
      }
      return metadonneesDuParticipant(participant).langue === maLangue;
    }

    /* ---------- Tuiles des participants ---------- */
    // Chaque nom reçoit une teinte stable, pour que chacun ait sa couleur.
    function teinte(nom) {
      let h = 0;
      for (const c of nom) h = (h * 31 + c.charCodeAt(0)) % 360;
      return h;
    }

    function creerTuile(nom, estMoi) {
      const el = document.createElement("article");
      el.className = "tuile holo" + (estMoi ? " moi" : "");
      el.dataset.tilt = "";
      el.style.setProperty("--h", teinte(nom));

      const flot = document.createElement("div");
      flot.className = "flot";

      const orbe = document.createElement("div");
      orbe.className = "orbe";
      orbe.textContent = (nom || "?").trim().charAt(0).toUpperCase();

      const etiquette = document.createElement("div");
      etiquette.className = "etiquette";
      const point = document.createElement("span");
      point.className = "point";
      const texte = document.createElement("span");
      texte.textContent = estMoi ? `${nom} (vous)` : nom;
      etiquette.append(point, texte);

      flot.append(orbe, etiquette);
      el.appendChild(flot);
      activerInclinaison(el);
      return el;
    }

    function ajouterTuile(identite, nom, estMoi = false) {
      if (tuiles.has(identite)) return;
      const el = creerTuile(nom, estMoi);
      tuiles.set(identite, el);
      grille.appendChild(el);
    }

    function retirerTuile(identite) {
      const el = tuiles.get(identite);
      if (!el) return;
      el.remove();
      tuiles.delete(identite);
    }

    /* ---------- Sous-titres ---------- */
    // Je n'affiche que le texte dans ma langue.
    // Si le participant parle ma langue, j'affiche son texte original ; sinon ma traduction.
    function afficherSousTitre(message) {
      if (!sousTitresActifs) return;
      let texte = null;
      if (message.langue_source === maLangue) {
        texte = message.original;
      } else {
        texte = (message.traductions || {})[maLangue] || null;
      }
      if (!texte) return;

      const ligne = document.createElement("p");

      const entete = document.createElement("div");
      entete.className = "entete-ligne";
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = (message.langue_source || "").toUpperCase();
      const auteur = document.createElement("span");
      auteur.className = "auteur";
      auteur.textContent = message.auteur;
      entete.append(badge, auteur);

      ligne.append(entete, document.createTextNode(texte));
      conteneurSousTitres.appendChild(ligne);

      while (conteneurSousTitres.children.length > 3) {
        conteneurSousTitres.firstElementChild.remove();
      }
      setTimeout(() => ligne.remove(), 15000);
    }

    /* ---------- Contrôles de l'appel ---------- */
    function majBouton(id, icone, libelle, actif) {
      const btn = document.getElementById(id);
      btn.innerHTML = icone + `<span>${libelle}</span>`;
      btn.classList.toggle("on", actif);
      btn.classList.toggle("off", !actif);
      btn.setAttribute("aria-pressed", String(actif));
    }

    function majTousLesBoutons() {
      majBouton("btn-sst", ICONES.sst, "Sous-titres", sousTitresActifs);
      majBouton("btn-voix", vocalActif ? ICONES.voix : ICONES.voixOff, "Voix IA", vocalActif);
      majBouton("btn-micro", micActif ? ICONES.micro : ICONES.microOff, "Micro", micActif);
      document.getElementById("btn-quitter").innerHTML = ICONES.fin + "<span>Raccrocher</span>";
    }

    document.getElementById("btn-sst").addEventListener("click", () => {
      sousTitresActifs = !sousTitresActifs;
      if (!sousTitresActifs) conteneurSousTitres.innerHTML = "";
      majTousLesBoutons();
    });

    document.getElementById("btn-voix").addEventListener("click", () => {
      vocalActif = !vocalActif;
      sortiesAudio.forEach(({ element }) => { element.muted = !vocalActif; });
      majTousLesBoutons();
    });

    document.getElementById("btn-micro").addEventListener("click", async () => {
      micActif = !micActif;
      majTousLesBoutons();
      if (room) {
        try { await room.localParticipant.setMicrophoneEnabled(micActif); }
        catch { statut("Impossible de changer l'état du micro.", true); }
      }
    });

    document.getElementById("btn-quitter").addEventListener("click", () => {
      if (room) room.disconnect();
    });

    function demarrerHorloge() {
      const debut = Date.now();
      const horloge = document.getElementById("horloge");
      clearInterval(minuterie);
      minuterie = setInterval(() => {
        const s = Math.floor((Date.now() - debut) / 1000);
        horloge.textContent =
          String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      }, 1000);
    }

    function reinitialiserAppel() {
      clearInterval(minuterie);
      tuiles.forEach((el) => el.remove());
      tuiles.clear();
      conteneurAudio.innerHTML = "";
      sortiesAudio.length = 0;
      conteneurSousTitres.innerHTML = "";
      room = null;
      micActif = true;
      vocalActif = true;
      sousTitresActifs = true;
      appel.hidden = true;
      accueil.hidden = false;
      selectLangue.disabled = false;
      selectVoix.disabled = false;
      document.getElementById("horloge").textContent = "00:00";
      statut("Appel terminé.");
    }

    /* ---------- Rejoindre ---------- */
    async function rejoindre() {
      const nom = document.getElementById("nom").value.trim();
      const salle = document.getElementById("salle").value.trim();
      const motdepasse = document.getElementById("motdepasse").value;
      maLangue = selectLangue.value;
      maVoix = selectVoix.value;

      if (!nom || !salle) { statut("Renseignez votre nom et la salle.", true); return; }
      if (!motdepasse) { statut("Saisissez le mot de passe de l'appel.", true); return; }
      if (!document.getElementById("consentement").checked) {
        statut("Vous devez accepter le traitement de votre voix pour rejoindre l'appel.", true);
        return;
      }
      if (!maVoix) { statut("Choisissez une voix.", true); return; }

      statut("Connexion en cours…");
      const reponse = await fetch(
        `/token?identite=${encodeURIComponent(nom)}&salle=${encodeURIComponent(salle)}` +
        `&langue=${encodeURIComponent(maLangue)}&voix=${encodeURIComponent(maVoix)}` +
        `&motdepasse=${encodeURIComponent(motdepasse)}`
      );
      if (reponse.status === 401) { statut("Mot de passe incorrect.", true); return; }
      if (!reponse.ok) { statut("Erreur : " + (await reponse.text()), true); return; }
      const { token, url } = await reponse.json();

      room = new Room();

      room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
        if (!doitEtreEntendu(track, publication, participant)) return;
        const element = track.attach();
        element.muted = !vocalActif;
        conteneurAudio.appendChild(element);
        sortiesAudio.push({ track, element });
      });

      room.on(RoomEvent.TrackUnsubscribed, (track) => {
        track.detach().forEach((element) => element.remove());
        const i = sortiesAudio.findIndex((s) => s.track === track);
        if (i >= 0) sortiesAudio.splice(i, 1);
      });

      room.on(RoomEvent.DataReceived, (payload, participant, kind, topic) => {
        if (topic !== "sous-titres") return;
        try {
          afficherSousTitre(JSON.parse(new TextDecoder().decode(payload)));
        } catch {
          // Message mal formé : on l'ignore.
        }
      });

      room.on(RoomEvent.ParticipantConnected, (participant) => {
        if (!participant.isAgent) ajouterTuile(participant.identity, participant.name || participant.identity);
      });

      room.on(RoomEvent.ParticipantDisconnected, (participant) => {
        retirerTuile(participant.identity);
      });

      room.on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
        const parlent = new Set(speakers.map((p) => p.identity));
        tuiles.forEach((el, identite) => el.classList.toggle("parle", parlent.has(identite)));
      });

      room.on(RoomEvent.Disconnected, reinitialiserAppel);

      await room.connect(url, token);

      let micro;
      try {
        micro = await createLocalAudioTrack();
      } catch {
        throw new Error("accès au micro refusé.");
      }
      await room.localParticipant.publishTrack(micro);

      ajouterTuile(room.localParticipant.identity, nom, true);
      room.remoteParticipants.forEach((p) => {
        if (!p.isAgent) ajouterTuile(p.identity, p.name || p.identity);
      });

      document.getElementById("titre-salle").textContent = salle;
      document.getElementById("sous-titre-salle").textContent =
        "Traduction : " + selectLangue.options[selectLangue.selectedIndex].text;
      selectLangue.disabled = true;
      selectVoix.disabled = true;
      document.getElementById("motdepasse").value = "";
      statut("");

      accueil.hidden = true;
      appel.hidden = false;
      majTousLesBoutons();
      demarrerHorloge();
    }

    document.getElementById("rejoindre").addEventListener("click", async (event) => {
      const bouton = event.currentTarget;
      bouton.disabled = true;
      bouton.classList.add("chargement");
      try {
        await rejoindre();
      } catch (erreur) {
        statut("Erreur : " + erreur.message, true);
        if (room) {
          const enCours = room;
          room = null;
          await enCours.disconnect();
        }
      } finally {
        bouton.disabled = false;
        bouton.classList.remove("chargement");
      }
    });

    majTousLesBoutons();
  </script>
</body>
</html>
