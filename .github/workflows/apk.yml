# Construit l'APK Android automatiquement (gratuit, sur les serveurs de GitHub).
# Lancement : onglet Actions > « Construire l'APK Android » > Run workflow.
# Le fichier app-debug.apk est disponible dans les résultats de l'exécution (Artifacts).
name: Construire l'APK Android

on:
  workflow_dispatch:
  push:
    branches: [version-navigateur]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Générer l'icône et l'écran de démarrage
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor "#05060c" --splashBackgroundColor "#05060c"

      - name: Autoriser le micro et le son
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Ouvrir l'application pour les liens du site
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          filtre = '''<intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="https" android:host="grace-shop.github.io" android:pathPrefix="/traduction" />
          </intent-filter>'''
          assert s.count("</activity>") >= 1
          s = s.replace("</activity>", filtre + "\n        </activity>", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Enregistrer l'identifiant de cette version
        run: echo "window.BUILD_ID = \"${GITHUB_SHA}\";" > docs/build.js

      - name: Copier le site dans l'application
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: appel-traduit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK sur une page de téléchargement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk appel-traduit.apk
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Appel traduit (Android)" --notes "Dernière version de l'application Android. Téléchargez appel-traduit.apk, puis installez-le sur votre téléphone." --prerelease
          gh release upload apk-latest appel-traduit.apk --clobber
          gh release edit apk-latest --notes "Build: ${GITHUB_SHA}"

      - name: Mettre à jour l'identifiant du site (sans relancer le build)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/build.js
          git diff --cached --quiet || (git commit -m "Met à jour l'identifiant de version [skip ci]" && git push origin HEAD:${GITHUB_REF_NAME})
