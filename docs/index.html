<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Appel traduit</title>
  <meta name="description" content="Appels où chacun parle sa langue et entend les autres traduits.">
  <meta name="theme-color" content="#05060c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Appel traduit">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone.svg">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body data-phase="accueil">
  <canvas id="fond" aria-hidden="true"></canvas>

  <main class="scene">
    <section class="panneau" aria-labelledby="titre">

      <header class="entete">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <radialGradient id="g" cx="35%" cy="30%" r="75%">
              <stop offset="0" stop-color="#e0faff"/>
              <stop offset=".3" stop-color="#7cf5ff"/>
              <stop offset=".75" stop-color="#8b5cf6"/>
              <stop offset="1" stop-color="#1e1b4b"/>
            </radialGradient>
          </defs>
          <circle cx="32" cy="32" r="30" fill="url(#g)"/>
          <ellipse cx="32" cy="32" rx="30" ry="9" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.2" transform="rotate(-18 32 32)"/>
        </svg>
        <div>
          <h1 class="titre" id="titre">Appel traduit</h1>
          <p class="sous-titre">Parlez votre langue, tout le monde comprend.</p>
        </div>
      </header>

      <!-- Vue 1 : rejoindre -->
      <div class="vue-accueil">
        <label class="champ" for="nom"><span>Votre nom</span>
          <input id="nom" autocomplete="off" maxlength="64" placeholder="Ex. Awa">
        </label>
        <label class="champ" for="langue"><span>Votre langue</span>
          <select id="langue"></select>
        </label>
        <label class="champ" for="voix"><span>Voix de lecture</span>
          <select id="voix"></select>
        </label>
        <label class="champ" for="salle"><span>Nom de la salle</span>
          <input id="salle" autocomplete="off" maxlength="64" placeholder="Ex. reunion-famille">
        </label>
        <label class="champ" for="motdepasse"><span>Mot de passe de l'appel</span>
          <input id="motdepasse" type="password" autocomplete="off">
        </label>

        <label class="consentement">
          <input id="consentement" type="checkbox">
          <span>J'accepte que ma voix soit reconnue par mon appareil, et que le texte soit traduit par un service tiers, pour cet appel uniquement.</span>
        </label>

        <button id="rejoindre" class="bouton" type="button">Rejoindre l'appel</button>
        <p id="statut" class="statut" role="status" aria-live="polite"></p>
        <p class="conseil">Un casque évite que la traduction ne soit captée par votre micro.</p>
      </div>

      <!-- Vue 2 : en appel -->
      <div class="vue-appel">
        <div class="barre">
          <p class="salle" id="nom-salle"></p>
          <span class="pastille">En direct</span>
        </div>

        <div class="orbe-zone" id="zone-orbe" aria-hidden="true">
          <span class="anneau"></span>
          <span class="anneau"></span>
          <span class="orbe"></span>
        </div>

        <div class="sous-titres" id="sous-titres" aria-live="polite"></div>

        <div class="commandes">
          <button id="micro" class="bouton secondaire" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            <span id="micro-libelle">Micro</span>
          </button>
          <button id="quitter" class="bouton danger" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 13c3.5-3.5 14.5-3.5 18 0l-2 3-3-1.5v-2c-2.2-.7-4.8-.7-7 0v2L6 16z"/></svg>
            Quitter
          </button>
        </div>
        <p id="etat" class="statut" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <div id="audio" aria-hidden="true"></div>

  <script src="langues.js"></script>
  <script src="config.js"></script>
  <script src="plateforme.js"></script>
  <script src="app.js"></script>
  <script type="module" src="fond3d.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
